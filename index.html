<!DOCTYPE html>
<html lang="zh-CN">
<!--
    页面名称：工作台（首页）
    对应数据库表：全部 14 张表（汇总展示）
    功能描述：平台数据总览：表规模说明、核心统计卡、岗位匹配排行、行业岗位分布、个人技能画像、学习进度、评估历史
    作者：刘帅 2621010714
    完成日期：2026-10-29
-->


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 · 职途智配</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================== 左侧固定导航：品牌 / 菜单（main.js 渲染）/ 当前用户 ==================== -->
    <aside class="side">
        <a class="brand" href="pages/welcome.html">
            <span class="brand-mark">TM</span>
            <span>
                <span class="brand-name">职途智配</span>
                <span class="brand-sub">TALENT MATCH</span>
            </span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot" id="sideWho"></div>
    </aside>

    <!-- ==================== 主内容区 ==================== -->
    <main class="main">
        <div class="wrap">

            <!-- 页头：标题 + 副标题 -->
            <header class="page-head">
                <div>
                    <p class="page-crumb">WORKBENCH</p>
                    <h1 class="page-title">职业匹配工作台</h1>
                    <p class="page-lede">把「我会什么」和「岗位要什么」放在一起比。匹配分按每项技能的权重算出来，差的技能排在后面。</p>
                </div>
            </header>

            <!-- 岗位匹配排行：按加权匹配度从高到低 -->
            <section class="sec">
                <div class="sec-head">
                    <span class="sec-no">01</span>
                    <h2 class="sec-title">岗位匹配排行</h2>
                    <span class="sec-note">按加权匹配度从高到低</span>
                </div>
                <div class="jobs-grid" id="rank"></div>
            </section>

            <!-- 左：行业岗位分布 ｜ 右：我的技能档案 -->
            <section class="sec">
                <div class="split">
                    <div class="split-main">
                        <div class="sec-head">
                            <span class="sec-no">02</span>
                            <h2 class="sec-title">行业岗位分布</h2>
                            <span class="sec-note">行业 → 岗位类别 → 岗位</span>
                        </div>
                        <div class="card" id="industry"></div>
                    </div>
                    <div class="split-side">
                        <div class="sec-head">
                            <span class="sec-no">03</span>
                            <h2 class="sec-title">我的技能档案</h2>
                        </div>
                        <div class="card" id="mySkills"></div>
                    </div>
                </div>
            </section>

            <!-- 左：进行中的学习计划 ｜ 右：历史评估记录 -->
            <section class="sec">
                <div class="split">
                    <div class="split-main">
                        <div class="sec-head">
                            <span class="sec-no">04</span>
                            <h2 class="sec-title">进行中的学习计划</h2>
                            <span class="sec-note" id="planNote"></span>
                        </div>
                        <div class="card" id="plan"></div>
                    </div>
                    <div class="split-side">
                        <div class="sec-head">
                            <span class="sec-no">05</span>
                            <h2 class="sec-title">历史评估</h2>
                        </div>
                        <div class="card" id="history"></div>
                    </div>
                </div>
            </section>

            <!-- 页脚 -->
            <footer class="foot">
                <span>&copy; 2026 职途智配 TalentMatch · 岗位能力匹配平台</span>
            </footer>

        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/index.js"></script>

</body>

</html>
